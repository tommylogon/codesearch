<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>codesearch</title>
<style>
  :root { --bg:#14161a; --panel:#1b1e24; --line:#2c313a; --fg:#d7dae0; --dim:#8b93a1; --acc:#4da3ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.45 system-ui,Segoe UI,sans-serif;
         height:100vh; display:grid; grid-template-columns: 420px 1fr; grid-template-rows: 1fr 300px; }
  #left { grid-row: 1 / 3; border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #searchbar { padding:10px; border-bottom:1px solid var(--line); background:var(--panel); }
  #q { width:100%; padding:8px 10px; background:#0f1115; color:var(--fg); border:1px solid var(--line); border-radius:4px; font-size:14px; }
  .chips { margin-top:6px; display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .chip { padding:2px 8px; border:1px solid var(--line); border-radius:10px; cursor:pointer; color:var(--dim); user-select:none; }
  .chip.on { background:var(--acc); color:#001; border-color:var(--acc); }
  .lbl { color:var(--dim); font-size:11px; margin-right:2px; }
  #status { padding:4px 10px; color:var(--dim); font-size:12px; border-bottom:1px solid var(--line); }
  #results { overflow:auto; flex:1; }
  .hit { padding:8px 10px; border-bottom:1px solid var(--line); cursor:pointer; }
  .hit:hover, .hit.sel { background:#222731; }
  .hit .t { display:flex; gap:6px; align-items:baseline; }
  .kind { font-size:10px; padding:0 5px; border-radius:3px; color:#000; font-weight:600; }
  .name { font-weight:600; word-break:break-all; }
  .loc { color:var(--dim); font-size:11px; }
  .doc { color:#aab1bd; font-size:12px; margin-top:3px; max-height:5.5em; overflow:auto; white-space:pre-wrap; }
  .rel { color:var(--dim); font-size:11px; margin-top:2px; }
  .matched { color:#6fcf97; font-size:10px; }
  #graphwrap { position:relative; min-height:0; }
  #graph { position:absolute; inset:0; }
  #graphbar { position:absolute; top:6px; left:8px; right:8px; z-index:2; display:flex; gap:6px; flex-wrap:wrap; align-items:center;
              background:rgba(27,30,36,.85); padding:4px 8px; border-radius:4px; }
  #hint { position:absolute; bottom:6px; left:8px; z-index:2; color:var(--dim); font-size:11px; background:rgba(20,22,26,.8); padding:2px 6px; border-radius:3px; }
  #inspector { border-top:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  #ihead { padding:6px 10px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  #ihead .path { font-weight:600; flex:1; word-break:break-all; }
  button, a.btn { background:#2a3140; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:3px 9px; cursor:pointer; text-decoration:none; font-size:12px; }
  button:hover, a.btn:hover { border-color:var(--acc); }
  #code { position:relative; overflow:auto; flex:1; font:12px/1.5 Consolas,Menlo,monospace; padding:4px 0; }
  .ln { display:flex; white-space:pre; }
  .ln .n { width:52px; text-align:right; padding-right:10px; color:var(--dim); user-select:none; flex-shrink:0; }
  .ln.hit1 { background:#25324a; }
  .legend span { margin-right:8px; font-size:11px; color:var(--dim); }
  .legend i { display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:3px; }
</style>
</head>
<body>
<div id="left">
  <div id="searchbar">
    <input id="q" placeholder="search code, comments, docs... (Enter)" autofocus>
    <div class="chips" id="kinds"><span class="lbl">kind</span></div>
    <div class="chips" id="langs"><span class="lbl">lang</span></div>
    <div class="chips" id="parts"><span class="lbl">index</span></div>
    <div class="chips" id="modes"><span class="lbl">mode</span></div>
  </div>
  <div id="status">type a query and press Enter. Click a result to see its graph, double-click a graph node to expand it.</div>
  <div id="results"></div>
</div>
<div id="graphwrap">
  <div id="graphbar">
    <span class="lbl">overview</span>
    <button id="ov-runtime" title="Runtime code files (engine, routes, static/js, templates)">runtime</button>
    <button id="ov-code" title="All code files including tools and tests">all code</button>
    <button id="ov-docs" title="Documentation and wiki files">docs</button>
    <span class="lbl">depth</span>
    <button id="d1">1</button><button id="d2">2</button>
    <span class="legend" id="legend"></span>
    <span id="gstat" class="lbl"></span>
  </div>
  <div id="graph"></div>
  <div id="hint">click = inspect code | double-click = expand neighbors | drag = move | scroll = zoom</div>
</div>
<div id="inspector">
  <div id="ihead"><span class="path" id="ipath">no node selected</span>
    <a class="btn" id="vsl" style="display:none">Open in VS Code</a>
    <button id="vsb" style="display:none">Open via server</button></div>
  <div id="code"></div>
</div>
<script src="/vendor/vis-network.js"></script>
<script>
const KIND_COLOR = {file:'#4da3ff', class:'#f2c94c', function:'#6fcf97', method:'#27ae60', variable:'#bb86fc',
                    comment:'#8b93a1', section:'#f2994a', block:'#56ccf2', element:'#eb5757'};
const EDGE_COLOR = {DEFINES:'#4b5563', CALLS:'#6fcf97', REFERENCES:'#bb86fc', IMPORTS:'#4da3ff',
                    INHERITS:'#f2c94c', ANNOTATES:'#8b93a1', LINKS_TO:'#f2994a'};
const state = {kinds:new Set(), langs:new Set(), part:'', any:false, strict:false, depth:1, current:null, nodes:null, edges:null, network:null};

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const $ = id => document.getElementById(id);

function chips(container, items, onToggle, single) {
  items.forEach(it => {
    const c = el('span', 'chip', it); c.onclick = () => { onToggle(it, c); }; container.appendChild(c);
  });
}
chips($('kinds'), ['file','class','function','method','variable','comment','section','block'], (k, c) => {
  state.kinds.has(k) ? state.kinds.delete(k) : state.kinds.add(k); c.classList.toggle('on'); search(); });
chips($('langs'), ['python','typescript','javascript','markdown','json','html','text'], (k, c) => {
  state.langs.has(k) ? state.langs.delete(k) : state.langs.add(k); c.classList.toggle('on'); search(); });
const partChips = [];
['filename','function_name','function','comment'].forEach(p => {
  const c = el('span', 'chip', p); c.onclick = () => {
    state.part = state.part === p ? '' : p; partChips.forEach(x => x.classList.toggle('on', x.textContent === state.part)); search(); };
  partChips.push(c); $('parts').appendChild(c); });
[['any word','any'],['strict','strict']].forEach(([label, key]) => {
  const c = el('span', 'chip', label); c.title = key === 'any' ? 'keyword list matches ANY word, not all' : 'only keyword matches; vectors just reorder';
  c.onclick = () => { state[key] = !state[key]; c.classList.toggle('on'); search(); }; $('modes').appendChild(c); });

$('legend').append(...Object.entries(EDGE_COLOR).map(([k, col]) => {
  const s = el('span'); const i = el('i'); i.style.background = col; s.append(i, k); return s; }));

async function api(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(url + ' -> ' + r.status); return r.json(); }

let seq = 0;
async function search() {
  const q = $('q').value.trim(); if (!q) return;
  const my = ++seq;
  const p = new URLSearchParams({q, limit: 30});
  state.kinds.forEach(k => p.append('kind', k)); state.langs.forEach(l => p.append('lang', l));
  if (state.part) p.set('part', state.part); if (state.any) p.set('any', '1'); if (state.strict) p.set('strict', '1');
  $('status').textContent = 'searching...';
  let data;
  try { data = await api('/api/search?' + p); } catch (e) { $('status').textContent = String(e); return; }
  if (my !== seq) return;
  $('status').textContent = data.results.length + ' results' + (data.note ? '  |  keyword only: ' + data.note : '');
  const box = $('results'); box.replaceChildren();
  data.results.forEach(h => box.appendChild(renderHit(h)));
}

function relLine(h) {
  const r = h.relations || {}; const parts = [];
  for (const k of ['called_by','calls','referenced_by','imports','imported_by','links_to','linked_from','annotates']) {
    if (r[k]) parts.push(k.replace('_',' ') + ' ' + r[k].count);
  }
  return parts.join('  |  ');
}

function renderHit(h) {
  const d = el('div', 'hit'); d.dataset.id = h.id;
  const t = el('div', 't'); const k = el('span', 'kind', h.kind); k.style.background = KIND_COLOR[h.kind] || '#999';
  const local = h.qualified_name.includes('::') ? h.qualified_name.split('::').slice(1).join('::') : h.name;
  t.append(k, el('span', 'name', local || h.file)); d.appendChild(t);
  d.appendChild(el('div', 'loc', h.file + ':' + h.line_start + (h.line_end !== h.line_start ? '-' + h.line_end : '')));
  if (h.signature && h.kind !== 'file') d.appendChild(el('div', 'loc', h.signature));
  if (h.docstring) d.appendChild(el('div', 'doc', h.docstring));
  const rl = relLine(h); if (rl) d.appendChild(el('div', 'rel', rl));
  d.appendChild(el('div', 'matched', h.matched.join(', ') + '  score ' + h.score));
  d.onclick = () => { document.querySelectorAll('.hit.sel').forEach(x => x.classList.remove('sel')); d.classList.add('sel'); focusNode(h.id); };
  return d;
}

function fileColor(rel) {
  if (rel.startsWith('engine/')) return '#27ae60';
  if (rel.startsWith('routes/')) return '#f2994a';
  if (rel.startsWith('static/')) return '#4da3ff';
  if (rel.startsWith('templates/')) return '#eb5757';
  if (rel.startsWith('docs/')) return '#f2c94c';
  if (rel.startsWith('tools/') || rel.startsWith('tests/')) return '#bb86fc';
  return '#56ccf2';
}

function nodeVis(n) {
  const local = n.qualified_name.includes('::') ? n.qualified_name.split('::').slice(1).join('::') : '';
  const base = (n.kind === 'file' ? n.file.split('/').pop() : (n.name || local || n.kind + '@' + n.line_start)).toString();
  const bg = n.kind === 'file' ? fileColor(n.file) : (KIND_COLOR[n.kind] || '#999');
  return {id: n.id, label: base.length > 34 ? base.slice(0, 33) + '...' : base, title: n.kind + ' ' + (local || n.file) + '\n' + n.file + ':' + n.line_start,
          color: {background: bg, border: '#000'}, font: {color: n.kind === 'comment' ? '#d7dae0' : '#111', size: 12},
          shape: n.kind === 'file' ? 'box' : (n.kind === 'comment' ? 'dot' : 'ellipse'), _meta: n};
}
function edgeVis(e) {
  const isOv = String(e.id).startsWith('ov_');
  return {id: e.id, from: e.from, to: e.to, arrows: 'to',
          color: {color: EDGE_COLOR[e.kind] || '#666', opacity: isOv ? 0.32 : 0.75},
          title: e.kind + (e.meta ? ' [' + e.meta + ']' : ''),
          width: (e.kind === 'DEFINES' || isOv) ? 1 : 2, dashes: e.kind === 'ANNOTATES'};
}

function ensureNetwork() {
  if (state.network) return;
  state.nodes = new vis.DataSet(); state.edges = new vis.DataSet();
  state.network = new vis.Network($('graph'), {nodes: state.nodes, edges: state.edges},
    {physics: {solver: 'forceAtlas2Based', stabilization: {iterations: 120}}, interaction: {hover: true}, layout: {improvedLayout: false}});
  state.network.on('click', p => { if (p.nodes.length) inspect(p.nodes[0]); });
  state.network.on('doubleClick', p => { if (p.nodes.length) expand(p.nodes[0]); });
}

// Merge a neighborhood into the existing datasets in place (one batched update, no rebuild).
function merge(data) {
  state.nodes.update(data.nodes.filter(n => !state.nodes.get(n.id)).map(nodeVis));
  state.edges.update(data.edges.filter(e => !state.edges.get(e.id)).map(edgeVis));
  $('gstat').textContent = state.nodes.length + ' nodes, ' + state.edges.length + ' edges' + (data.truncated ? '  (neighborhood truncated)' : '');
}

async function focusNode(id) {
  ensureNetwork();
  state.nodes.clear(); state.edges.clear();
  const data = await api('/api/graph/' + id + '?depth=' + state.depth);
  merge(data);
  state.network.once('stabilizationIterationsDone', () => state.network.fit({animation: true}));
  state.network.selectNodes([id]);
  inspect(id);
}
async function expand(id) { merge(await api('/api/graph/' + id + '?depth=1')); }

async function inspect(id) {
  const n = await api('/api/node/' + id);
  state.current = n;
  const end = n.line_end;
  $('ipath').textContent = n.file + ':' + n.line_start + (end !== n.line_start ? '-' + end : '') + '   [' + n.kind + '] ' + (n.name || '');
  let code;
  try { code = await api('/api/code?path=' + encodeURIComponent(n.file) + '&start=' + n.line_start + '&end=' + end + '&context=2'); }
  catch (e) { $('code').replaceChildren(el('div', 'loc', 'file not readable: ' + e.message)); return; }
  const box = $('code'); box.replaceChildren();
  code.lines.forEach((text, i) => {
    const num = code.start + i; const row = el('div', 'ln' + (num >= code.hit_start && num <= code.hit_end ? ' hit1' : ''));
    row.append(el('span', 'n', String(num)), el('span', null, text)); box.appendChild(row);
  });
  const first = box.querySelector('.hit1'); if (first) box.scrollTop = Math.max(0, first.offsetTop - 40);
  const abs = code.absolute.replace(/\\/g, '/');
  const a = $('vsl'); a.href = 'vscode://file/' + abs + ':' + n.line_start + ':1'; a.style.display = '';
  const b = $('vsb'); b.style.display = '';
  b.onclick = async () => {
    try { const r = await fetch('/api/open', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path: n.file, line: n.line_start})});
          const j = await r.json(); $('status').textContent = j.ok ? 'opened ' + j.opened : j.error; } catch (e) { $('status').textContent = String(e); } };
}

async function loadOverview(scope) {
  ensureNetwork();
  state.nodes.clear(); state.edges.clear();
  $('gstat').textContent = 'loading ' + scope + ' overview...';
  const data = await api('/api/overview?scope=' + encodeURIComponent(scope));
  merge(data);
  $('gstat').textContent = 'overview (' + data.scope + '): ' + state.nodes.length + ' files, ' + state.edges.length + ' edges';
  state.network.stabilize(80);
  state.network.fit({animation: false});
}

$('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
[1, 2].forEach(d => { $('d' + d).onclick = () => { state.depth = d; if (state.current) focusNode(state.current.id); }; });
[['ov-runtime','runtime'],['ov-code','code'],['ov-docs','docs']].forEach(([id, sc]) => { $(id).onclick = () => loadOverview(sc); });

(async function boot() {
  const params = new URLSearchParams(location.search);
  if (params.get('depth')) state.depth = Math.max(1, Math.min(2, Number(params.get('depth')) || 1));
  if (params.get('q')) { $('q').value = params.get('q'); await search(); }
  const nodeParam = Number(params.get('node'));
  if (nodeParam) {
    await focusNode(nodeParam);
    const exp = (params.get('expand') || '').split(',').map(x => Number(x.trim())).filter(Boolean);
    for (const eid of exp) await expand(eid);
  } else {
    await loadOverview(params.get('overview') || 'runtime');
  }
})();
</script>
</body>
</html>
